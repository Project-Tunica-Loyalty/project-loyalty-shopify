query CartInput {
  cart {
    attribute(key: "project_loyalty_redemption") { value }
    buyerIdentity {
      isAuthenticated
      phone
      customer { id }
    }
    deliveryGroups { deliveryAddress { phone } }
    billingAddress { phone }
    cost { subtotalAmount { amount } }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "loyalty_discount", key: "configuration") {
      value
    }
  }
}
