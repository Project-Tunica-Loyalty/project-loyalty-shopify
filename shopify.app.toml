# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7346dc5e7373a5489b073afa7bb14ffd"
name = "reglrs-loyalty-app"
application_url = "https://shopify.reglrs.ai"
embedded = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [
  "orders/create",
  "orders/fulfilled",
  "orders/updated",
  "orders/cancelled",
  "refunds/create",
  "orders/paid"
]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[events]
api_version = "2026-10"

  [[events.subscription]]
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.variants.price", "product.variants.compareAtPrice" ]
  uri = "https://shopify.reglrs.ai/webhooks/products/update"
  query = """
  query product_variant_price_change($productId: ID!, $variantsId: ID!) {\r\r
    product(id: $productId) {\r\r
      id\r\r
      title\r\r
      status\r\r
    }\r\r
    productVariant(id: $variantsId) {\r\r
      id\r\r
      title\r\r
      price\r\r
      compareAtPrice\r\r
    }\r\r
  }\r\r
  """
  query_filter = "product.status:'ACTIVE'"
  handle = "product-price-change"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_orders,read_products,write_app_proxy,write_discounts"

[auth]
redirect_urls = [ "https://shopify.reglrs.ai/auth/callback" ]

[app_proxy]
url = "https://shopify.reglrs.ai/apps/loyalty"
subpath = "loyalty"
prefix = "apps"

[build]
automatically_update_urls_on_dev = false
